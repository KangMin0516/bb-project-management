services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: bbpm
      POSTGRES_PASSWORD: bbpm_secret
      POSTGRES_DB: bbpm_db
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bbpm -d bbpm_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
