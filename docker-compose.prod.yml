# =============================================================================
# BB Project Management - Production Docker Compose
# =============================================================================
# Usage:
#   docker compose -f docker-compose.prod.yml up -d
#
# `app` and `web` reference pre-built images pulled from GHCR (built +
# pushed by the `build-and-push` CI job via docker-compose.ci.yml) instead
# of building on the server — see docker-compose.ci.yml for the build side.
#
# Required environment variables in .env:
#   - JWT_SECRET
#   - JWT_SHARE_SECRET
#   - ADMIN_PASSWORD
#   - POSTGRES_PASSWORD
#   - IMAGE_TAG
# =============================================================================

services:
  db:
    image: postgres:16-alpine
    container_name: bbpm-db
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - bbpm_pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bbpm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-bbpm_db}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bbpm} -d ${POSTGRES_DB:-bbpm_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: always
    networks:
      - bbpm-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  app:
    image: ghcr.io/${GHCR_OWNER:-burningbrosdabi}/bbpm-api:${IMAGE_TAG:?IMAGE_TAG must be set}
    container_name: bbpm-app
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-bbpm}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-bbpm_db}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-1h}
      - JWT_SHARE_SECRET=${JWT_SHARE_SECRET:?JWT_SHARE_SECRET must be set}
      - SHARE_JWT_EXPIRES_IN=${SHARE_JWT_EXPIRES_IN:-2h}
      - SHARE_LINK_PASSCODE_FAIL_THRESHOLD=${SHARE_LINK_PASSCODE_FAIL_THRESHOLD:-20}
      - SHARE_LINK_LOCKOUT_MINUTES=${SHARE_LINK_LOCKOUT_MINUTES:-60}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@burningb.com}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?ADMIN_PASSWORD must be set}
      - API_PORT=3000
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000}
      - AWS_S3_BUCKET=${AWS_S3_BUCKET:-}
      - AWS_S3_REGION=${AWS_S3_REGION:-ap-northeast-2}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - SLACK_CLIENT_ID=${SLACK_CLIENT_ID:-}
      - SLACK_CLIENT_SECRET=${SLACK_CLIENT_SECRET:-}
      - SLACK_REDIRECT_URI=${SLACK_REDIRECT_URI:-}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-}
      - SLACK_SIGNING_SECRET=${SLACK_SIGNING_SECRET:-}
      - FRONTEND_URL=${FRONTEND_URL:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - MGMT_DIGEST_ENABLED=${MGMT_DIGEST_ENABLED:-false}
      - MGMT_DIGEST_CHANNEL_ID=${MGMT_DIGEST_CHANNEL_ID:-}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/docs"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 40s
    restart: always
    networks:
      - bbpm-network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  web:
    image: ghcr.io/${GHCR_OWNER:-burningbrosdabi}/bbpm-web:${IMAGE_TAG:?IMAGE_TAG must be set}
    container_name: bbpm-web
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      app:
        condition: service_healthy
    networks:
      - bbpm-network
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  bbpm_pgdata:
    driver: local

networks:
  bbpm-network:
    driver: bridge
