# =============================================================================
# BB Project Management - Production Docker Compose
# =============================================================================
# Usage:
#   docker compose -f docker-compose.prod.yml up -d
#
# Required environment variables in .env:
#   - JWT_SECRET
#   - ADMIN_PASSWORD
#   - POSTGRES_PASSWORD
# =============================================================================

services:
  db:
    image: postgres:16-alpine
    container_name: bbpm-db
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - bbpm_pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bbpm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-bbpm_db}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bbpm} -d ${POSTGRES_DB:-bbpm_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: always
    networks:
      - bbpm-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  app:
    build:
      context: .
      dockerfile: packages/api/Dockerfile
      target: production
    container_name: bbpm-app
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-bbpm}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-bbpm_db}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-8h}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@burningb.com}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?ADMIN_PASSWORD must be set}
      - API_PORT=3000
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/docs"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 40s
    restart: always
    networks:
      - bbpm-network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  web:
    build:
      context: .
      dockerfile: packages/web/Dockerfile
      target: production
    container_name: bbpm-web
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      app:
        condition: service_healthy
    networks:
      - bbpm-network
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  bbpm_pgdata:
    driver: local

networks:
  bbpm-network:
    driver: bridge
