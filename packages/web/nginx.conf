server {
    listen 3000;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Must match (or exceed) the API's ATTACHMENT_MAX_SIZE constant
    # (50 MB). Without this nginx falls back to its 1 MB default and
    # rejects file uploads with 413 before the request reaches NestJS.
    client_max_body_size 50m;

    # API reverse proxy to backend
    location /api {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_read_timeout 120s;
    }

    # OAuth discovery — RFC 8414 + RFC 9728 require well-known docs at
    # host-root paths (e.g. /.well-known/oauth-authorization-server/api),
    # not under /api/. NestJS already excludes /.well-known/* from its
    # global '/api' prefix; nginx just needs to forward those requests
    # to the backend instead of letting the SPA's catch-all swallow
    # them. Claude.ai's MCP connector fails without this (PM-44).
    location /.well-known/ {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Share link proxy (OG crawlers + browser redirect)
    location ~ ^/share/ {
        rewrite ^/share/(.*)$ /api/share/$1 break;
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
