# =============================================================================
# GHCR Cleanup
# =============================================================================
# Every merge to main pushes a new commit-sha-tagged image (see deploy.yml's
# build-and-push job) and none are ever deleted — GHCR storage grows by one
# full image pair (api + web) per merge, forever. This runs weekly and keeps
# only the most recent N tagged versions of each package, deleting the rest.
# `latest` is explicitly protected regardless of age/count.
#
# No secrets to configure — uses the workflow's own secrets.GITHUB_TOKEN,
# same as build-and-push/deploy in deploy.yml.
# =============================================================================

name: Cleanup GHCR

on:
  schedule:
    - cron: '0 3 * * 0' # Sundays 03:00 UTC
  workflow_dispatch:

jobs:
  cleanup:
    name: Delete old package versions
    runs-on: ubuntu-latest
    permissions:
      packages: write
    strategy:
      matrix:
        package: [bbpm-api, bbpm-web]

    steps:
      - name: Delete old ${{ matrix.package }} versions
        uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ matrix.package }}
          package-type: container
          min-versions-to-keep: 10
          ignore-versions: '^latest$'
