name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-deploy
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build images
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: docker compose -f docker-compose.ci.yml build

      - name: Push images
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: docker compose -f docker-compose.ci.yml push

      # Every merge pushes a new commit-sha-tagged image and nothing ever
      # deleted an old one — GHCR storage grew by one image pair per merge,
      # forever. Runs right here (not a separate scheduled workflow) so
      # cleanup happens every deploy instead of waiting up to a week.
      # `min-versions-to-keep` always includes the tag just pushed above, so
      # this can never delete the version this same run is about to deploy.
      - name: Delete old bbpm-api versions
        uses: actions/delete-package-versions@v5
        with:
          package-name: bbpm-api
          package-type: container
          min-versions-to-keep: 10
          ignore-versions: '^latest$'

      - name: Delete old bbpm-web versions
        uses: actions/delete-package-versions@v5
        with:
          package-name: bbpm-web
          package-type: container
          min-versions-to-keep: 10
          ignore-versions: '^latest$'

  deploy:
    name: Deploy to Production
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GHCR_ACTOR: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_TAG: ${{ github.sha }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_SHARE_SECRET: ${{ secrets.JWT_SHARE_SECRET }}
          SHARE_JWT_EXPIRES_IN: ${{ vars.SHARE_JWT_EXPIRES_IN }}
          SHARE_LINK_PASSCODE_FAIL_THRESHOLD: ${{ vars.SHARE_LINK_PASSCODE_FAIL_THRESHOLD }}
          SHARE_LINK_LOCKOUT_MINUTES: ${{ vars.SHARE_LINK_LOCKOUT_MINUTES }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          CORS_ORIGINS: ${{ secrets.CORS_ORIGINS }}
          AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
          AWS_S3_REGION: ${{ secrets.AWS_S3_REGION }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          SLACK_CLIENT_ID: ${{ secrets.SLACK_CLIENT_ID }}
          SLACK_CLIENT_SECRET: ${{ secrets.SLACK_CLIENT_SECRET }}
          SLACK_REDIRECT_URI: ${{ secrets.SLACK_REDIRECT_URI }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          SLACK_SIGNING_SECRET: ${{ secrets.SLACK_SIGNING_SECRET }}
          FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          APP_PORT: ${{ vars.APP_PORT }}
          DB_PORT: ${{ vars.DB_PORT }}
          DOMAIN: ${{ vars.DOMAIN }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          command_timeout: 15m
          envs: GH_TOKEN,GHCR_ACTOR,GHCR_TOKEN,IMAGE_TAG,JWT_SECRET,JWT_SHARE_SECRET,SHARE_JWT_EXPIRES_IN,SHARE_LINK_PASSCODE_FAIL_THRESHOLD,SHARE_LINK_LOCKOUT_MINUTES,ADMIN_EMAIL,ADMIN_PASSWORD,POSTGRES_USER,POSTGRES_PASSWORD,POSTGRES_DB,CORS_ORIGINS,AWS_S3_BUCKET,AWS_S3_REGION,AWS_ACCESS_KEY_ID,AWS_SECRET_ACCESS_KEY,SLACK_CLIENT_ID,SLACK_CLIENT_SECRET,SLACK_REDIRECT_URI,ENCRYPTION_KEY,SLACK_SIGNING_SECRET,FRONTEND_URL,ANTHROPIC_API_KEY,APP_PORT,DB_PORT,DOMAIN
          script: |
            set -e

            APP_DIR="/var/www/bb-project-management"
            REPO_URL="https://${GH_TOKEN}@github.com/${{ github.repository }}.git"
            COMPOSE="docker compose -f docker-compose.prod.yml"

            echo "=== Starting deployment ==="

            # Clone or update repository
            if [ -d "$APP_DIR/.git" ]; then
              echo "Pulling latest changes..."
              cd $APP_DIR
              git fetch origin main
              git reset --hard origin/main
            else
              echo "Cloning repository..."
              rm -rf $APP_DIR
              git clone $REPO_URL $APP_DIR
              cd $APP_DIR
            fi

            # Create .env file
            cat > .env << ENVEOF
            JWT_SECRET=$JWT_SECRET
            JWT_EXPIRES_IN=1h
            JWT_SHARE_SECRET=$JWT_SHARE_SECRET
            SHARE_JWT_EXPIRES_IN=${SHARE_JWT_EXPIRES_IN:-2h}
            SHARE_LINK_PASSCODE_FAIL_THRESHOLD=${SHARE_LINK_PASSCODE_FAIL_THRESHOLD:-20}
            SHARE_LINK_LOCKOUT_MINUTES=${SHARE_LINK_LOCKOUT_MINUTES:-60}
            ADMIN_EMAIL=${ADMIN_EMAIL:-admin@burningb.com}
            ADMIN_PASSWORD=$ADMIN_PASSWORD
            POSTGRES_USER=${POSTGRES_USER:-bbpm}
            POSTGRES_PASSWORD=$POSTGRES_PASSWORD
            POSTGRES_DB=${POSTGRES_DB:-bbpm_db}
            CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000}
            AWS_S3_BUCKET=${AWS_S3_BUCKET:-}
            AWS_S3_REGION=${AWS_S3_REGION:-ap-northeast-2}
            AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
            AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
            SLACK_CLIENT_ID=${SLACK_CLIENT_ID:-}
            SLACK_CLIENT_SECRET=${SLACK_CLIENT_SECRET:-}
            SLACK_REDIRECT_URI=${SLACK_REDIRECT_URI:-}
            ENCRYPTION_KEY=${ENCRYPTION_KEY:-}
            SLACK_SIGNING_SECRET=${SLACK_SIGNING_SECRET:-}
            FRONTEND_URL=${FRONTEND_URL:-}
            ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
            APP_PORT=${APP_PORT:-3000}
            DB_PORT=${DB_PORT:-5433}
            IMAGE_TAG=$IMAGE_TAG
            NODE_ENV=production
            ENVEOF
            sed -i 's/^            //' .env

            # Stop existing containers (preserve volumes/data)
            echo "Stopping existing containers..."
            $COMPOSE down --remove-orphans || true
            docker stop bbpm-db bbpm-app bbpm-web 2>/dev/null || true
            docker rm bbpm-db bbpm-app bbpm-web 2>/dev/null || true

            # Pull pre-built images (built + pushed by the build-and-push job).
            # Login uses the workflow's own ephemeral GITHUB_TOKEN, streamed in
            # over SSH — never stored on the server (logged out below).
            echo "Logging in to GHCR..."
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_ACTOR" --password-stdin
            echo "Pulling images..."
            $COMPOSE pull app web

            # Start database first
            echo "Starting database..."
            $COMPOSE up -d db

            # Wait for database to be healthy
            echo "Waiting for database..."
            RETRY=0
            until docker inspect --format='{{.State.Health.Status}}' bbpm-db 2>/dev/null | grep -q healthy; do
              RETRY=$((RETRY + 1))
              if [ $RETRY -ge 30 ]; then
                echo "Database failed to become healthy"
                $COMPOSE logs db --tail=50
                exit 1
              fi
              sleep 2
            done
            echo "Database is healthy"

            # Run database migrations
            echo "Running database migrations..."
            # Resolve any previously failed migrations before deploying
            $COMPOSE run --rm --user root app sh -c "cd /app/packages/api && npx prisma migrate resolve --rolled-back 20260423052600_add_reviewer_assignee_to_issues 2>/dev/null || true"
            if ! $COMPOSE run --rm --user root app sh -c "cd /app/packages/api && npx prisma migrate deploy"; then
              echo "=== Migration failed ==="
              exit 1
            fi
            echo "Migrations applied successfully"

            # Clean up leftover containers from `compose run`
            docker rm -f $(docker ps -aq --filter "name=bbpm-app" --filter "status=exited") 2>/dev/null || true

            # Start all services
            echo "Starting all services..."
            if ! $COMPOSE up -d; then
              echo "=== compose up failed; app logs ==="
              $COMPOSE logs app --tail=150 --no-log-prefix || true
              echo "=== db logs ==="
              $COMPOSE logs db --tail=50 || true
              exit 1
            fi

            # Connect web container to Traefik's overlay network
            echo "Connecting bbpm-web to proxy-net..."
            docker network connect proxy-net bbpm-web 2>/dev/null || true

            # Wait for backend health check
            echo "Running backend health check..."
            MAX_RETRIES=12
            RETRY_COUNT=0
            until curl -sf http://localhost:${APP_PORT:-3000}/api/docs > /dev/null; do
              RETRY_COUNT=$((RETRY_COUNT + 1))
              if [ $RETRY_COUNT -ge $MAX_RETRIES ]; then
                echo "Health check failed after $MAX_RETRIES attempts"
                echo "=== App logs ==="
                $COMPOSE logs app --tail=100 --no-log-prefix
                echo "=== DB logs ==="
                $COMPOSE logs db --tail=50
                exit 1
              fi
              echo "Attempt $RETRY_COUNT/$MAX_RETRIES, retrying in 10s..."
              sleep 10
            done

            # Wait for frontend
            echo "Checking frontend..."
            RETRY_COUNT=0
            until curl -sf http://localhost:${APP_PORT:-3000} > /dev/null; do
              RETRY_COUNT=$((RETRY_COUNT + 1))
              if [ $RETRY_COUNT -ge $MAX_RETRIES ]; then
                echo "Frontend check failed"
                $COMPOSE logs web --tail=50
                exit 1
              fi
              sleep 5
            done

            # Cleanup — `-a` also removes the previous deploy's now-unused
            # tagged image (not just dangling layers), since every deploy
            # pulls a fresh commit-sha tag that never gets reused. The
            # `until=24h` filter keeps anything from the last 24h untouched,
            # so a mid-flight image from this exact deploy is never at risk.
            docker image prune -af --filter "until=24h"
            docker logout ghcr.io

            # Configure host nginx for domain (if DOMAIN is set)
            if [ -n "$DOMAIN" ]; then
              NGINX_CONF="/etc/nginx/sites-available/$DOMAIN"

              if [ -d "/etc/letsencrypt/live/$DOMAIN" ]; then
                echo "Setting up nginx with SSL for $DOMAIN..."
                cat > $NGINX_CONF << 'NGINXEOF'
            server {
                listen 80;
                server_name DOMAIN_PLACEHOLDER;
                return 301 https://$server_name$request_uri;
            }

            server {
                listen 443 ssl http2;
                server_name DOMAIN_PLACEHOLDER;

                ssl_certificate /etc/letsencrypt/live/DOMAIN_PLACEHOLDER/fullchain.pem;
                ssl_certificate_key /etc/letsencrypt/live/DOMAIN_PLACEHOLDER/privkey.pem;
                include /etc/letsencrypt/options-ssl-nginx.conf;
                ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

                client_max_body_size 55M;

                location / {
                    proxy_pass http://localhost:APP_PORT_PLACEHOLDER;
                    proxy_http_version 1.1;
                    proxy_set_header Host $host;
                    proxy_set_header X-Real-IP $remote_addr;
                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto $scheme;
                    proxy_set_header Upgrade $http_upgrade;
                    proxy_set_header Connection "upgrade";
                }
            }
            NGINXEOF
              else
                echo "Setting up nginx without SSL for $DOMAIN..."
                cat > $NGINX_CONF << 'NGINXEOF'
            server {
                listen 80;
                server_name DOMAIN_PLACEHOLDER;

                client_max_body_size 55M;

                location / {
                    proxy_pass http://localhost:APP_PORT_PLACEHOLDER;
                    proxy_http_version 1.1;
                    proxy_set_header Host $host;
                    proxy_set_header X-Real-IP $remote_addr;
                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto $scheme;
                    proxy_set_header Upgrade $http_upgrade;
                    proxy_set_header Connection "upgrade";
                }
            }
            NGINXEOF
              fi

              sed -i 's/^            //' $NGINX_CONF
              sed -i "s/DOMAIN_PLACEHOLDER/$DOMAIN/g" $NGINX_CONF
              sed -i "s/APP_PORT_PLACEHOLDER/${APP_PORT:-3000}/g" $NGINX_CONF
              ln -sf $NGINX_CONF /etc/nginx/sites-enabled/

              if nginx -t; then
                systemctl reload nginx
                echo "Nginx configured and reloaded for $DOMAIN"
              else
                echo "Nginx configuration test failed!"
                exit 1
              fi

              # SSL via certbot (only if not already configured)
              if [ ! -d "/etc/letsencrypt/live/$DOMAIN" ]; then
                echo "Installing SSL certificate for $DOMAIN..."
                if ! command -v certbot &> /dev/null; then
                  apt-get update && apt-get install -y certbot python3-certbot-nginx
                fi
                if certbot --nginx -d $DOMAIN --non-interactive --agree-tos -m admin@burningbros.vn --redirect; then
                  echo "SSL certificate installed for $DOMAIN"
                else
                  echo "WARNING: SSL certificate installation failed (DNS may not be configured yet). Skipping."
                fi
              fi
            fi

            echo "=== Deployment successful! ==="
            $COMPOSE ps
